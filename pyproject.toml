[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nba-analytics-duckdb"
version = "0.1.0"
description = "Unofficial NBA analytics pipeline built with Airflow, Cosmos, dbt, and DuckDB."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "dbt-duckdb>=1.10",
  "duckdb>=1.1.0",
  "httpx>=0.28",
  "pyarrow>=16.0",
  "polars>=1.20",
]

[project.optional-dependencies]
airflow = [
  "apache-airflow==3.4.0",
  "astronomer-cosmos==1.16.0",
]
ml = [
  "joblib>=1.4",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "xgboost>=2.1",
]
live = [
  "nba-api>=1.11",
  "pdfplumber>=0.11.9",
]
full = ["nba-analytics-duckdb[ml,live]"]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
nba-duckdb = "nba_duckdb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_duckdb"]
exclude = [
  "dbt/.user.yml",
  "dbt/target/**",
  "dbt/dbt_packages/**",
]

[tool.hatch.build.targets.wheel.force-include]
"dbt_project.yml" = "nba_duckdb/dbt_project.yml"
"dbt" = "nba_duckdb/dbt"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905", "UP017"]

[tool.ruff.lint.per-file-ignores]
"src/nba_duckdb/utils/nba_client.py" = ["E402", "I001"]
