name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: uv sync --extra dev --extra full
      - run: uv run ruff check src tests scripts examples dags
      - run: make dbt-parse
      - run: uv run pytest
      - run: make check-artifacts
      - run: make check-diagrams
      - run: uv run nba-duckdb run-smoke
      - run: make quality
      - run: uv run nba-duckdb run-smoke --quick
      - run: make example-basic-team-summary
      - run: make check-wheel

  airflow:
    runs-on: ubuntu-latest
    env:
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__OPENLINEAGE__NAMESPACE: nba-analytics-duckdb
      AIRFLOW__COSMOS__ENABLE_DATASET_AIRFLOW3_URI: "True"
    steps:
      - name: Configure runtime paths
        run: |
          echo "AIRFLOW_HOME=${RUNNER_TEMP}/airflow" >> "${GITHUB_ENV}"
          echo "NBA_DUCKDB_SMOKE_PATH=${RUNNER_TEMP}/airflow-smoke.duckdb" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra full --extra airflow
      - run: make airflow-check
      - run: make airflow-smoke

  light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run ruff check src tests scripts examples dags
      - run: uv run pytest -q
      - run: uv run nba-duckdb run-smoke --quick

  dependency-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: uv sync --extra dev --extra ml
      - run: make dbt-parse
      - run: uv run nba-duckdb run-smoke
      - run: uv sync --extra dev --extra live
      - run: uv run pytest tests/test_cli_orchestration.py::test_run_live_default_with_live_extra_missing_ml_reports_ml_only tests/test_cli_orchestration.py::test_run_live_quick_with_live_extra_does_not_require_ml -q
      - name: Plain pip light install
        run: |
          python -m venv /tmp/nba-duckdb-pip-light
          . /tmp/nba-duckdb-pip-light/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          NBA_DUCKDB_SMOKE_PATH=/tmp/nba-duckdb-pip-light-smoke.duckdb nba-duckdb run-smoke --quick

  full-extra-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra full
      - run: |
          uv run python - <<'PY'
          from importlib.util import find_spec

          for module in (
              "dbt",
              "dbt.adapters.duckdb",
              "joblib",
              "nba_api",
              "pdfplumber",
              "scipy",
              "sklearn",
              "umap",
              "xgboost",
          ):
              assert find_spec(module), module
          PY
      - run: NBA_DUCKDB_SMOKE_PATH=/tmp/nba-duckdb-${{ matrix.python-version }}-quick.duckdb uv run nba-duckdb run-smoke --quick
