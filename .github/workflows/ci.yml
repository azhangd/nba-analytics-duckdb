name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: uv sync --extra dev --extra full
      - run: uv run ruff check src tests scripts examples
      - run: make dbt-parse
      - run: uv run pytest
      - run: uv run dagster definitions validate -m nba_duckdb.definitions
      - run: make check-artifacts
      - run: make check-diagrams
      - run: uv run nba-duckdb run-smoke
      - run: make quality
      - run: uv run nba-duckdb run-smoke --quick
      - run: make example-basic-team-summary
      - run: make check-wheel

  light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run ruff check src tests scripts examples
      - run: uv run pytest -q
      - run: uv run nba-duckdb run-smoke --quick

  dependency-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --extra dev --extra ml
      - run: make dbt-parse
      - run: uv run nba-duckdb run-smoke
      - run: uv sync --extra dev --extra live
      - run: uv run pytest tests/test_cli_orchestration.py::test_run_live_default_with_live_extra_missing_ml_reports_ml_only tests/test_cli_orchestration.py::test_run_live_quick_with_live_extra_does_not_require_ml -q
      - name: Plain pip light install
        run: |
          python -m venv /tmp/nba-duckdb-pip-light
          . /tmp/nba-duckdb-pip-light/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          NBA_DUCKDB_SMOKE_PATH=/tmp/nba-duckdb-pip-light-smoke.duckdb nba-duckdb run-smoke --quick

  full-extra-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra full
      - run: |
          uv run python - <<'PY'
          from importlib.util import find_spec

          for module in (
              "dagster",
              "dagster_dbt",
              "dagster_duckdb",
              "dagster_webserver",
              "dbt",
              "dbt.adapters.duckdb",
              "joblib",
              "nba_api",
              "pdfplumber",
              "scipy",
              "sklearn",
              "umap",
              "xgboost",
          ):
              assert find_spec(module), module
          PY
      - run: NBA_DUCKDB_SMOKE_PATH=/tmp/nba-duckdb-${{ matrix.python-version }}-quick.duckdb uv run nba-duckdb run-smoke --quick
