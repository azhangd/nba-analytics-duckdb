version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all minor/patch bumps; majors still arrive one per PR.
      uv-minor-patch:
        update-types: [minor, patch]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # dbt-core 2.x is a placeholder that breaks dbt-duckdb; pyproject caps it <2.
      - dependency-name: dbt-core
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
