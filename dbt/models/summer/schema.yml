version: 2

models:
  - name: summer_league_games
    description: Summer League games
    columns:
      - name: game_id
        data_tests:
          - not_null
          - unique
      - name: season
        data_tests:
          - not_null
      - name: league_id
        data_tests:
          - not_null
      - name: competition
        data_tests:
          - not_null

  - name: summer_league_boxscores
    description: Summer League box scores
    columns:
      - name: game_id
        data_tests:
          - not_null
      - name: player_id
        data_tests:
          - not_null

  - name: summer_league_play_by_play
    description: Summer League play-by-play
    columns:
      - name: game_id
        data_tests:
          - not_null
      - name: action_id
        data_tests:
          - not_null

  - name: summer_league_shots
    description: Summer League shots
    columns:
      - name: game_id
        data_tests:
          - not_null
      - name: game_event_id
        data_tests:
          - not_null
