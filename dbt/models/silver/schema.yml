version: 2

models:
  - name: dim_teams
    description: Team names, conference and division
    columns:
      - name: team_id
        data_tests:
          - not_null
          - unique

  - name: dim_players
    description: Position, height, weight and current team
    columns:
      - name: player_id
        data_tests:
          - not_null
          - unique

  - name: dim_coaches
    description: Coach names, school and birth date
    columns:
      - name: coach_id
        data_tests:
          - not_null
          - unique

  - name: dim_player_external_identities
    description: Wikidata and Wikipedia IDs for each player
    columns:
      - name: player_id
        data_tests:
          - not_null
          - unique

  - name: dim_injuries
    description: Current injuries with status, type and return date
    columns:
      - name: athlete_espn_id
        data_tests:
          - not_null
          - unique

  - name: fct_team_coach_seasons
    description: Coaching staff for each team and season
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: coach_id
        data_tests:
          - not_null

  - name: fct_games
    description: Each game with date, teams, score and game type
    columns:
      - name: game_id
        data_tests:
          - not_null
          - unique
      - name: league_id
        description: NBA-operated league identifier used by the source feed.
        data_tests:
          - not_null
      - name: competition
        description: Stable warehouse competition slug, such as nba or summer_league_vegas.
        data_tests:
          - not_null

  - name: fct_boxscores
    description: Traditional and advanced stats per player per game
    columns:
      - name: game_id
        data_tests:
          - not_null
      - name: player_id
        data_tests:
          - not_null

  - name: fct_play_by_play
    description: Every play with type, player, score and location
    columns:
      - name: game_id
        data_tests:
          - not_null
      - name: action_id
        description: Source-native action identifier, unique within a game.
        data_tests:
          - not_null

  - name: fct_possessions
    description: Every possession with how it started and ended
    columns:
      - name: game_id
        data_tests:
          - not_null

  - name: fct_shots
    description: Every shot with zone, distance, location and result
    columns:
      - name: game_id
        data_tests:
          - not_null
      - name: game_event_id
        description: NBA game event identifier, unique within a game.
        data_tests:
          - not_null

  - name: fct_lineups
    description: Lineup stints with points for and against
    columns:
      - name: game_id
        data_tests:
          - not_null

  - name: fct_hustle
    description: Contests, deflections, screen assists and box-outs

  - name: fct_tracking
    description: Player tracking stats by category

  - name: fct_matchups
    description: Who guarded whom, with points and shooting

  - name: fct_defense_play_types
    description: Defensive efficiency by play type

  - name: fct_game_detail
    description: Points off turnovers, second chance, fast break and paint
