      - name: season
        data_tests:
          - not_null

  - name: player_season_feature_matrix
    description: Wide player-season feature matrix for downstream analysis, built after runtime gold inputs such as embeddings and RAPM are available.
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
