version: 2

models:
  - name: player_game_stats
    description: Game logs with shot zones and game score
    columns:
      - name: game_id
        data_tests:
          - not_null
      - name: player_id
        data_tests:
          - not_null

  - name: team_game_stats
    description: Game logs with score, margin and ratings
    columns:
      - name: game_id
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: team_season_elo
    description: Elo rating and projected wins
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: team_game_elo_history
    description: Elo before and after each game
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: game_id
        data_tests:
          - not_null

  - name: player_season_stats
    description: Season averages, percentiles, BPM and VORP
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: player_game_rolling_stats
    description: Last 3, 5 and 10 game averages and hot or cold flags
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: game_id
        data_tests:
          - not_null

  - name: player_season_split_stats
    description: Splits by home or away, result, month and rest
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: split_type
        data_tests:
          - not_null
      - name: split_value
        data_tests:
          - not_null

  - name: player_season_archetypes
    description: Offensive role, such as creator or stretch shooter
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: player_season_on_off_stats
    description: Net rating with the player on and off the court
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: player_combo_season_stats
    description: Net rating of two- and three-player combinations
    columns:
      - name: season
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null

  - name: lineup_season_stats
    description: Five-player lineup minutes and net rating
    columns:
      - name: season
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null

  - name: player_season_mvp_ladder
    description: MVP-style composite ranking
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: player_season_feature_matrix
    description: One wide row per player season for modeling
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: team_season_feature_matrix
    description: One wide row per team season for modeling
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: game_flow_snapshots
    description: Score and home win probability through each game
    columns:
      - name: game_id
        data_tests:
          - not_null

  - name: player_zone_season_shot_quality
    description: Actual vs. expected FG% by zone
    columns:
      - name: season
        data_tests:
          - not_null
      - name: player_id
        data_tests:
          - not_null

  - name: team_season_play_type_stats
    description: Points per possession by play type
    columns:
      - name: season
        data_tests:
          - not_null
      - name: offense_team_id
        data_tests:
          - not_null

  - name: team_season_play_type_splits
    description: Play types by period, margin and clutch
    columns:
      - name: season
        data_tests:
          - not_null
      - name: offense_team_id
        data_tests:
          - not_null

  - name: player_season_stats_base
    description: Season averages, shooting and percentiles
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: team_season_four_factors
    description: Four factors, pace and Pythagorean wins
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: team_season_percentile_ranks
    description: Percentile ranks for the four factors and pace
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: team_season_starter_bench_stats
    description: Starters vs. bench
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: player_season_load_management
    description: Minutes and workload
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: team_season_clutch_stats
    description: Points per possession in clutch time
    columns:
      - name: offense_team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: team_season_opponent_scouting
    description: Record and margin against each opponent
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: team_season_timeout_stats
    description: Timeouts by quarter and in the clutch
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: team_season_ato_stats
    description: Offense and defense after timeouts
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: player_season_clutch_stats
    description: Scoring in clutch time
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: team_season_shot_profile
    description: Shot mix and FG% by zone
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: player_season_shot_profile
    description: Shot mix and FG% by zone
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
