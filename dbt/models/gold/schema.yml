version: 2

models:
  - name: player_game_stats
    description: One row per player and game, with shot-bucket enrichments.
    columns:
      - name: game_id
        data_tests:
          - not_null
      - name: player_id
        data_tests:
          - not_null

  - name: team_game_stats
    description: One row per team and game.
    columns:
      - name: game_id
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: team_season_elo
    description: Transparent team-season Elo rating heuristic.
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: team_game_elo_history
    description: One row per team and game Elo update.
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: game_id
        data_tests:
          - not_null

  - name: player_season_stats
    description: Final player-season table combining the dbt base mart with transparent adjustments.
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: player_game_rolling_stats
    description: Player-game rolling form windows and trend flags.
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: game_id
        data_tests:
          - not_null

  - name: player_season_split_stats
    description: Player-season splits by home/away, result, score context, month, and rest.
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: split_type
        data_tests:
          - not_null
      - name: split_value
        data_tests:
          - not_null

  - name: player_season_archetypes
    description: Player-season offensive archetype classifier output.
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: player_season_on_off_stats
    description: Player-season lineup on/off differential summary.
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null

  - name: player_combo_season_stats
    description: Two-player and three-player lineup combination summaries.
    columns:
      - name: season
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null

  - name: lineup_season_stats
    description: Team-season five-player lineup summaries.
    columns:
      - name: season
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null

  - name: player_season_mvp_ladder
